<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Plain application form fixture</title></head>
  <body>
    <!--
      Hand-written on purpose, and deliberately NOT a captured ATS page: this
      fixture's whole job is to be a form with NO captcha markup of any kind, so
      the panel's deterministic scan outcome on it is `done`. The captured pages
      all carry challenge widgets, which makes their outcome `captcha`.
    -->
    <h1>Apply: Backend Engineer</h1>
    <form id="plain_app">
      <p>
        <label for="first_name">First name</label>
        <input id="first_name" name="first_name" type="text">
      </p>
      <p>
        <label for="last_name">Last name</label>
        <input id="last_name" name="last_name" type="text">
      </p>
      <p>
        <label for="email">Email</label>
        <input id="email" name="email" type="email">
      </p>
      <p>
        <label for="work_auth">Are you authorized to work in the US?</label>
        <select id="work_auth" name="work_auth">
          <option value="">Select…</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </p>
      <button type="submit" id="submit_plain">Submit application</button>
    </form>
  </body>
</html>
